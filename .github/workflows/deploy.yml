name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      # 1. Install the Helm Engine binaries directly onto the Cloud Runner VM host
      - name: Set up Helm Client
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      # 2. Reconstruct your dynamic embedded cluster context directly into the secure cloud VM session
      - name: Setup Embedded Minikube Credentials
        run: |
          mkdir -p $HOME/.kube
          cat << 'EOF' > $HOME/.kube/config
          apiVersion: v1
          clusters:
