name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      - name: Set up Helm Client
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kubernetes Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Generate Cloud Helm Chart Output File
        run: |
          set +e

          OUTPUT_FILE="./helm-chart-output.yaml"
          RELEASE_NAME="expo-web-release"
          CHART_PATH="./charts/my-web-app"
          NAMESPACE="default"
          IMAGE_REPO="${{ secrets.REGISTRY_USERNAME }}/expo-web-app"
          IMAGE_TAG="${{ github.sha }}"

          echo "# ============================================================" > $OUTPUT_FILE
          echo "# HELM CHART DEPLOYMENT OUTPUT" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# Generated At : $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $OUTPUT_FILE
          echo "# Workflow     : Git Push -> Build Image -> Push Registry -> Helm Upgrade -> Kubernetes Deployment" >> $OUTPUT_FILE
          echo "# Docker Image : $IMAGE_REPO:$IMAGE_TAG" >> $OUTPUT_FILE
          echo "# Helm Release : $RELEASE_NAME" >> $OUTPUT_FILE
          echo "# Namespace    : $NAMESPACE" >> $OUTPUT_FILE
          echo "# Chart Path   : $CHART_PATH" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "" >> $OUTPUT_FILE

          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# KUBERNETES CONNECTION CHECK" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl cluster-info >> $OUTPUT_FILE 2>&1
          CONNECTION_STATUS=$?

          if [ $CONNECTION_STATUS -ne 0 ]; then
            echo "" >> $OUTPUT_FILE
            echo "# ERROR: Kubernetes cluster is not reachable from GitHub Actions runner." >> $OUTPUT_FILE
            echo "# Reason: Your kubeconfig is pointing to localhost / Minikube." >> $OUTPUT_FILE
            echo "# Fix: Use a real cloud Kubernetes cluster like EKS, AKS, GKE, or self-hosted runner on your local machine." >> $OUTPUT_FILE
            cat $OUTPUT_FILE
            exit 1
          fi

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# HELM RENDERED MANIFEST" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          helm template $RELEASE_NAME $CHART_PATH \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="$IMAGE_TAG" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace $NAMESPACE >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# HELM UPGRADE OUTPUT" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          helm upgrade --install $RELEASE_NAME $CHART_PATH \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="$IMAGE_TAG" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace $NAMESPACE \
            --create-namespace >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# HELM RELEASE STATUS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          helm status $RELEASE_NAME --namespace $NAMESPACE >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# HELM RELEASE VALUES" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          helm get values $RELEASE_NAME --namespace $NAMESPACE >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# KUBERNETES DEPLOYMENT STATUS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl get deployment --namespace $NAMESPACE -o wide >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# KUBERNETES POD STATUS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl get pods --namespace $NAMESPACE -o wide >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# KUBERNETES SERVICE STATUS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl get svc --namespace $NAMESPACE -o wide >> $OUTPUT_FILE 2>&1

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# POD CPU AND MEMORY METRICS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl top pods --namespace $NAMESPACE >> $OUTPUT_FILE 2>&1 || echo "Metrics Server not available yet." >> $OUTPUT_FILE

          echo "" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          echo "# NODE CPU AND MEMORY METRICS" >> $OUTPUT_FILE
          echo "# ============================================================" >> $OUTPUT_FILE
          kubectl top nodes >> $OUTPUT_FILE 2>&1 || echo "Metrics Server not available yet." >> $OUTPUT_FILE

          cat $OUTPUT_FILE

      - name: Upload Helm Output Artifact to GitHub Run View
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-output-file
          path: ./helm-chart-output.yaml
          retention-days: 7

      - name: Send Deployment Status Email via Outlook
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.OUTLOOK_MAIL_USERNAME }}
          password: ${{ secrets.OUTLOOK_MAIL_PASSWORD }}
          subject: "GitOps Cloud Rollout Verification: ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "GitHub Actions Runner <${{ secrets.OUTLOOK_MAIL_USERNAME }}>"
          secure: false
          priority: high
          attachments: ./helm-chart-output.yaml
          body: |
            Hello Team,

            The CICD pipeline has completed.

            Docker Image:
            ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

            The Helm output file is attached.

            Best Regards,
            GitHub Actions