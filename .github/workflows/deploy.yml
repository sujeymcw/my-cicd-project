name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 3. Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      - name: 4. Start Minikube Cluster
        uses: medyagh/setup-minikube@master
        with:
          cache: true

      - name: 5. Enable Metrics Server
        run: |
          minikube addons enable metrics-server

          kubectl patch deployment metrics-server -n kube-system --type='json' \
            -p='[
              {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},
              {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname"}
            ]' || true

          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s || true

          echo "Waiting for Metrics API to become ready..."
          for i in {1..30}; do
            if kubectl top nodes >/dev/null 2>&1; then
              echo "Metrics API is ready."
              break
            fi
            echo "Metrics API not ready yet. Attempt $i/30"
            sleep 10
          done

      - name: 6. Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: 7. Create Helm Output File
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" > $logFile
          echo "#           AUTOMATED DEVOPS HELM DEPLOYMENT REPORT           " >> $logFile
          echo "# ============================================================" >> $logFile
          echo "# Generated At : $(date -u) UTC" >> $logFile
          echo "# Commit SHA   : ${{ github.sha }}" >> $logFile
          echo "# Docker Image : ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}" >> $logFile
          echo "# Namespace    : default" >> $logFile
          echo "# ============================================================" >> $logFile
          echo "" >> $logFile

      - name: 8. Render Helm Manifest
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# HELM RENDERED MANIFEST                                      " >> $logFile
          echo "# ============================================================" >> $logFile
          helm template expo-web-release ./charts/my-web-app \
            --set image.repository="${{ secrets.REGISTRY_USERNAME }}/expo-web-app" \
            --set image.tag="${{ github.sha }}" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace default >> $logFile 2>&1
          echo "" >> $logFile

      - name: 9. Deploy Application with Helm
        run: |
          helm upgrade --install expo-web-release ./charts/my-web-app \
            --set image.repository="${{ secrets.REGISTRY_USERNAME }}/expo-web-app" \
            --set image.tag="${{ github.sha }}" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace default

      - name: 10. Verify Application Rollout
        run: |
          logFile="./helm-chart-output.yaml"

          echo "# ============================================================" >> $logFile
          echo "# KUBERNETES DEPLOYMENT STATUS                                " >> $logFile
          echo "# ============================================================" >> $logFile
          echo "" >> $logFile

          echo "# --- DEPLOYMENTS (default namespace) ---" >> $logFile
          kubectl get deployments -n default -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- PODS (default namespace) ---" >> $logFile
          kubectl get pods -n default -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- SERVICES (default namespace) ---" >> $logFile
          kubectl get svc -n default -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- REPLICASETS (default namespace) ---" >> $logFile
          kubectl get replicasets -n default -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- NODES (cluster-wide) ---" >> $logFile
          kubectl get nodes -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- NODE DESCRIBE (full detail) ---" >> $logFile
          kubectl describe nodes >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- POD DESCRIBE (default namespace) ---" >> $logFile
          kubectl describe pods -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- EVENTS (default namespace) ---" >> $logFile
          kubectl get events -n default --sort-by='.lastTimestamp' >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- CONFIG MAPS (default namespace) ---" >> $logFile
          kubectl get configmaps -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- SECRETS (default namespace) ---" >> $logFile
          kubectl get secrets -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- PERSISTENT VOLUMES ---" >> $logFile
          kubectl get pv >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- PERSISTENT VOLUME CLAIMS ---" >> $logFile
          kubectl get pvc -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- INGRESS (default namespace) ---" >> $logFile
          kubectl get ingress -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- HORIZONTAL POD AUTOSCALERS ---" >> $logFile
          kubectl get hpa -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- RESOURCE QUOTAS ---" >> $logFile
          kubectl get resourcequota -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

          echo "# --- LIMIT RANGES ---" >> $logFile
          kubectl get limitrange -n default >> $logFile 2>&1 || true
          echo "" >> $logFile

      - name: 10.5 Capture Real Pod and Node Metrics with Visual Bars
        run: |
          logFile="./helm-chart-output.yaml"

          # ---- Helper: ASCII bar generator ----
          # Usage: ascii_bar <value_int> <max_int> <width>
          ascii_bar() {
            local val=$1
            local max=$2
            local width=${3:-40}
            if [ "$max" -eq 0 ]; then max=1; fi
            local filled=$(( val * width / max ))
            local empty=$(( width - filled ))
            local bar=""
            for i in $(seq 1 $filled); do bar="${bar}#"; done
            for i in $(seq 1 $empty); do bar="${bar}-"; done
            echo "[${bar}] ${val}/${max}"
          }

          # ---- Helper: parse millicores (e.g. 45m -> 45, 1200m -> 1200, 2 -> 2000) ----
          parse_cpu_m() {
            local raw=$1
            if echo "$raw" | grep -q 'm'; then
              echo "$raw" | tr -d 'm'
            else
              echo $(( ${raw} * 1000 ))
            fi
          }

          # ---- Helper: parse MiB (e.g. 256Mi -> 256, 1Gi -> 1024) ----
          parse_mem_mi() {
            local raw=$1
            if echo "$raw" | grep -q 'Gi'; then
              echo $(( $(echo "$raw" | tr -d 'Gi') * 1024 ))
            elif echo "$raw" | grep -q 'Mi'; then
              echo "$raw" | tr -d 'Mi'
            elif echo "$raw" | grep -q 'Ki'; then
              echo $(( $(echo "$raw" | tr -d 'Ki') / 1024 ))
            else
              echo "$raw"
            fi
          }

          echo "# ============================================================" >> $logFile
          echo "# REAL KUBERNETES NODE AND POD METRICS WITH VISUAL BARS       " >> $logFile
          echo "# ============================================================" >> $logFile
          echo "# Captured At : $(date -u) UTC" >> $logFile
          echo "" >> $logFile

          # ---- NODE METRICS ----
          echo "# ============================================================" >> $logFile
          echo "# NODE CPU AND MEMORY METRICS                                  " >> $logFile
          echo "# ============================================================" >> $logFile

          NODE_RAW=$(kubectl top nodes 2>&1 || true)
          echo "$NODE_RAW" >> $logFile
          echo "" >> $logFile

          echo "# NODE METRICS VISUAL BARS (CPU=millicores/2000m max  MEM=MiB/3800MiB max)" >> $logFile
          echo "" >> $logFile

          echo "$NODE_RAW" | tail -n +2 | while read -r line; do
            NODE_NAME=$(echo "$line" | awk '{print $1}')
            CPU_RAW=$(echo "$line"  | awk '{print $2}')
            MEM_RAW=$(echo "$line"  | awk '{print $4}')

            if [ -z "$NODE_NAME" ] || [ "$NODE_NAME" = "NAME" ]; then continue; fi

            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")

            CPU_BAR=$(ascii_bar ${CPU_M:-0} 2000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 3800 40)

            echo "  Node     : $NODE_NAME" >> $logFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $logFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $logFile
            echo "" >> $logFile
          done

          # ---- POD METRICS - DEFAULT NAMESPACE ----
          echo "# ============================================================" >> $logFile
          echo "# POD CPU AND MEMORY METRICS - DEFAULT NAMESPACE               " >> $logFile
          echo "# ============================================================" >> $logFile

          POD_DEFAULT_RAW=$(kubectl top pods -n default 2>&1 || true)
          echo "$POD_DEFAULT_RAW" >> $logFile
          echo "" >> $logFile

          echo "# POD METRICS VISUAL BARS - DEFAULT NAMESPACE (CPU=millicores/1000m max  MEM=MiB/512MiB max)" >> $logFile
          echo "" >> $logFile

          echo "$POD_DEFAULT_RAW" | tail -n +2 | while read -r line; do
            POD_NAME=$(echo "$line" | awk '{print $1}')
            CPU_RAW=$(echo "$line"  | awk '{print $2}')
            MEM_RAW=$(echo "$line"  | awk '{print $3}')

            if [ -z "$POD_NAME" ] || [ "$POD_NAME" = "NAME" ]; then continue; fi

            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")

            CPU_BAR=$(ascii_bar ${CPU_M:-0} 1000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 512 40)

            echo "  Pod      : $POD_NAME" >> $logFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $logFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $logFile
            echo "" >> $logFile
          done

          # ---- POD METRICS - ALL NAMESPACES ----
          echo "# ============================================================" >> $logFile
          echo "# POD CPU AND MEMORY METRICS - ALL NAMESPACES                  " >> $logFile
          echo "# ============================================================" >> $logFile

          POD_ALL_RAW=$(kubectl top pods --all-namespaces 2>&1 || true)
          echo "$POD_ALL_RAW" >> $logFile
          echo "" >> $logFile

          echo "# POD METRICS VISUAL BARS - ALL NAMESPACES (CPU=millicores/1000m max  MEM=MiB/512MiB max)" >> $logFile
          echo "" >> $logFile

          echo "$POD_ALL_RAW" | tail -n +2 | while read -r line; do
            NS=$(echo "$line"       | awk '{print $1}')
            POD_NAME=$(echo "$line" | awk '{print $2}')
            CPU_RAW=$(echo "$line"  | awk '{print $3}')
            MEM_RAW=$(echo "$line"  | awk '{print $4}')

            if [ -z "$POD_NAME" ] || [ "$POD_NAME" = "NAME" ]; then continue; fi

            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")

            CPU_BAR=$(ascii_bar ${CPU_M:-0} 1000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 512 40)

            echo "  Namespace: $NS" >> $logFile
            echo "  Pod      : $POD_NAME" >> $logFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $logFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $logFile
            echo "" >> $logFile
          done

          echo "" >> $logFile

          # ---- FULL DETAILED POD JSON FOR EACH POD ----
          echo "# ============================================================" >> $logFile
          echo "# FULL POD DETAILS - JSON (ALL NAMESPACES)                     " >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl get pods --all-namespaces -o json >> $logFile 2>&1 || true
          echo "" >> $logFile

          # ---- FULL NODE JSON ----
          echo "# ============================================================" >> $logFile
          echo "# FULL NODE DETAILS - JSON                                     " >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl get nodes -o json >> $logFile 2>&1 || true
          echo "" >> $logFile

          # ---- KUBE SYSTEM PODS ----
          echo "# ============================================================" >> $logFile
          echo "# KUBE-SYSTEM PODS STATUS                                      " >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl get pods -n kube-system -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

          # ---- CLUSTER INFO ----
          echo "# ============================================================" >> $logFile
          echo "# CLUSTER INFO                                                 " >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl cluster-info >> $logFile 2>&1 || true
          echo "" >> $logFile

          # ---- TOP NODES PERCENTAGE DETAILED ----
          echo "# ============================================================" >> $logFile
          echo "# NODE RESOURCE ALLOCATION DETAIL                              " >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl describe nodes | grep -A 10 "Allocated resources" >> $logFile 2>&1 || true
          echo "" >> $logFile

      - name: 11. Install Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          helm upgrade --install prometheus prometheus-community/prometheus \
            --namespace monitoring \
            --create-namespace \
            --set alertmanager.enabled=false \
            --set server.persistentVolume.enabled=false \
            --set pushgateway.enabled=false \
            --set kube-state-metrics.enabled=true \
            --set prometheus-node-exporter.enabled=true

          kubectl rollout status deployment/prometheus-server -n monitoring --timeout=180s

      - name: 12. Create Real Grafana Dashboard ConfigMap
        run: |
          cat > grafana-kubernetes-dashboard.json <<'EOF'
          {
            "uid": "cluster-status",
            "title": "Kubernetes Cluster Live Dashboard",
            "tags": ["kubernetes", "prometheus", "devops"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "10s",
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "Running Pods",
                "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
                "targets": [
                  {
                    "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
                    "legendFormat": "Running Pods",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              },
              {
                "id": 2,
                "type": "stat",
                "title": "Cluster Nodes",
                "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
                "targets": [
                  {
                    "expr": "count(up{job=~\".*node.*|.*kubernetes.*\"})",
                    "legendFormat": "Nodes",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Node CPU Usage %",
                "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                    "legendFormat": "{{instance}} CPU %",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Node Memory Usage %",
                "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
                    "legendFormat": "{{instance}} Memory %",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "Pod CPU Usage",
                "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by(namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\", pod!=\"\"}[5m]))",
                    "legendFormat": "{{namespace}}/{{pod}}",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              },
              {
                "id": 6,
                "type": "timeseries",
                "title": "Pod Memory Usage",
                "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by(namespace, pod) (container_memory_working_set_bytes{container!=\"\", pod!=\"\"})",
                    "legendFormat": "{{namespace}}/{{pod}}",
                    "refId": "A"
                  }
                ],
                "datasource": { "type": "prometheus", "uid": "Prometheus" }
              }
            ]
          }
          EOF

          kubectl create configmap grafana-kubernetes-dashboard \
            -n monitoring \
            --from-file=grafana-kubernetes-dashboard.json \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl label configmap grafana-kubernetes-dashboard \
            -n monitoring grafana_dashboard=1 --overwrite

      - name: 13. Install Grafana with Real Dashboard Provisioning
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --set persistence.enabled=false \
            --set adminUser=admin \
            --set adminPassword=admin \
            --set sidecar.dashboards.enabled=true \
            --set sidecar.dashboards.label=grafana_dashboard \
            --set sidecar.dashboards.folder=/tmp/dashboards \
            --set datasources."datasources\.yaml".apiVersion=1 \
            --set datasources."datasources\.yaml".datasources[0].name=Prometheus \
            --set datasources."datasources\.yaml".datasources[0].uid=Prometheus \
            --set datasources."datasources\.yaml".datasources[0].type=prometheus \
            --set datasources."datasources\.yaml".datasources[0].url=http://prometheus-server.monitoring.svc.cluster.local:80 \
            --set datasources."datasources\.yaml".datasources[0].access=proxy \
            --set datasources."datasources\.yaml".datasources[0].isDefault=true

          kubectl rollout status deployment/grafana -n monitoring --timeout=180s

      - name: 14. Export Real Grafana Dashboard JSON
        run: |
          sleep 45

          kubectl port-forward -n monitoring svc/grafana 3000:80 > /tmp/grafana-port-forward.log 2>&1 &
          echo $! > /tmp/grafana-port-forward.pid
          sleep 10

          curl -s -u admin:admin \
            http://localhost:3000/api/dashboards/uid/cluster-status \
            -o grafana-native-dashboard.json

          test -s grafana-native-dashboard.json

      - name: 15. Capture Actual Grafana Dashboard Screenshot
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

          cat > capture-grafana.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });

            await page.goto('http://localhost:3000/login', { waitUntil: 'networkidle' });
            await page.fill('input[name="user"]', 'admin');
            await page.fill('input[name="password"]', 'admin');
            await page.click('button[type="submit"]');
            await page.waitForTimeout(5000);

            await page.goto('http://localhost:3000/d/cluster-status/kubernetes-cluster-live-dashboard?orgId=1&refresh=10s', {
              waitUntil: 'networkidle'
            });

            await page.waitForTimeout(15000);
            await page.screenshot({
              path: 'actual-grafana-dashboard.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node capture-grafana.js

      - name: 16. Create Observability Audit Report
        run: |
          obsFile="./observability-audit-report.yaml"

          # ---- Helper: ASCII bar ----
          ascii_bar() {
            local val=$1
            local max=$2
            local width=${3:-40}
            if [ "$max" -eq 0 ]; then max=1; fi
            local filled=$(( val * width / max ))
            local empty=$(( width - filled ))
            local bar=""
            for i in $(seq 1 $filled); do bar="${bar}#"; done
            for i in $(seq 1 $empty); do bar="${bar}-"; done
            echo "[${bar}] ${val}/${max}"
          }

          parse_cpu_m() {
            local raw=$1
            if echo "$raw" | grep -q 'm'; then
              echo "$raw" | tr -d 'm'
            else
              echo $(( ${raw} * 1000 ))
            fi
          }

          parse_mem_mi() {
            local raw=$1
            if echo "$raw" | grep -q 'Gi'; then
              echo $(( $(echo "$raw" | tr -d 'Gi') * 1024 ))
            elif echo "$raw" | grep -q 'Mi'; then
              echo "$raw" | tr -d 'Mi'
            elif echo "$raw" | grep -q 'Ki'; then
              echo $(( $(echo "$raw" | tr -d 'Ki') / 1024 ))
            else
              echo "$raw"
            fi
          }

          echo "# ============================================================" > $obsFile
          echo "#       KUBERNETES OBSERVABILITY STACK AUDIT REPORT           " >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "# Status       : ACTIVE" >> $obsFile
          echo "# Namespace    : monitoring" >> $obsFile
          echo "# Prometheus   : Installed" >> $obsFile
          echo "# Grafana      : Installed" >> $obsFile
          echo "# Dashboard    : Real Grafana Dashboard UID cluster-status" >> $obsFile
          echo "# Generated At : $(date -u) UTC" >> $obsFile
          echo "# Commit SHA   : ${{ github.sha }}" >> $obsFile
          echo "# Docker Image : ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "" >> $obsFile

          # ---- MONITORING STACK ----
          echo "# ============================================================" >> $obsFile
          echo "# MONITORING NAMESPACE - PODS                                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get pods -n monitoring -o wide >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# MONITORING NAMESPACE - SERVICES                              " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get svc -n monitoring -o wide >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# MONITORING NAMESPACE - DEPLOYMENTS                           " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get deployments -n monitoring -o wide >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# MONITORING NAMESPACE - CONFIGMAPS                            " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get configmaps -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# PROMETHEUS TARGETS (via API)                                 " >> $obsFile
          echo "# ============================================================" >> $obsFile
          PROM_POD=$(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$PROM_POD" ]; then
            kubectl exec -n monitoring "$PROM_POD" -c prometheus-server -- \
              wget -qO- http://localhost:9090/api/v1/targets 2>/dev/null >> $obsFile || true
          fi
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# GRAFANA DATASOURCE VALIDATION                                " >> $obsFile
          echo "# ============================================================" >> $obsFile
          curl -s -u admin:admin http://localhost:3000/api/datasources >> $obsFile || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# GRAFANA DASHBOARD API VALIDATION                             " >> $obsFile
          echo "# ============================================================" >> $obsFile
          curl -s -u admin:admin http://localhost:3000/api/dashboards/uid/cluster-status >> $obsFile || true
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# GRAFANA HEALTH CHECK                                         " >> $obsFile
          echo "# ============================================================" >> $obsFile
          curl -s http://localhost:3000/api/health >> $obsFile || true
          echo "" >> $obsFile

          # ---- REAL NODE METRICS WITH BARS ----
          echo "# ============================================================" >> $obsFile
          echo "# REAL NODE METRICS WITH VISUAL BARS                           " >> $obsFile
          echo "# ============================================================" >> $obsFile

          NODE_RAW=$(kubectl top nodes 2>&1 || true)
          echo "$NODE_RAW" >> $obsFile
          echo "" >> $obsFile
          echo "# NODE METRICS VISUAL BARS (CPU=millicores/2000m max  MEM=MiB/3800MiB max)" >> $obsFile
          echo "" >> $obsFile

          echo "$NODE_RAW" | tail -n +2 | while read -r line; do
            NODE_NAME=$(echo "$line" | awk '{print $1}')
            CPU_RAW=$(echo "$line"  | awk '{print $2}')
            MEM_RAW=$(echo "$line"  | awk '{print $4}')
            if [ -z "$NODE_NAME" ] || [ "$NODE_NAME" = "NAME" ]; then continue; fi
            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")
            CPU_BAR=$(ascii_bar ${CPU_M:-0} 2000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 3800 40)
            echo "  Node     : $NODE_NAME" >> $obsFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $obsFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $obsFile
            echo "" >> $obsFile
          done

          # ---- POD METRICS DEFAULT ----
          echo "# ============================================================" >> $obsFile
          echo "# REAL POD METRICS - DEFAULT NAMESPACE WITH VISUAL BARS        " >> $obsFile
          echo "# ============================================================" >> $obsFile

          POD_DEFAULT_RAW=$(kubectl top pods -n default 2>&1 || true)
          echo "$POD_DEFAULT_RAW" >> $obsFile
          echo "" >> $obsFile
          echo "# POD METRICS VISUAL BARS - DEFAULT NAMESPACE (CPU=millicores/1000m max  MEM=MiB/512MiB max)" >> $obsFile
          echo "" >> $obsFile

          echo "$POD_DEFAULT_RAW" | tail -n +2 | while read -r line; do
            POD_NAME=$(echo "$line" | awk '{print $1}')
            CPU_RAW=$(echo "$line"  | awk '{print $2}')
            MEM_RAW=$(echo "$line"  | awk '{print $3}')
            if [ -z "$POD_NAME" ] || [ "$POD_NAME" = "NAME" ]; then continue; fi
            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")
            CPU_BAR=$(ascii_bar ${CPU_M:-0} 1000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 512 40)
            echo "  Pod      : $POD_NAME" >> $obsFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $obsFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $obsFile
            echo "" >> $obsFile
          done

          # ---- POD METRICS ALL NAMESPACES ----
          echo "# ============================================================" >> $obsFile
          echo "# REAL POD METRICS - ALL NAMESPACES WITH VISUAL BARS           " >> $obsFile
          echo "# ============================================================" >> $obsFile

          POD_ALL_RAW=$(kubectl top pods --all-namespaces 2>&1 || true)
          echo "$POD_ALL_RAW" >> $obsFile
          echo "" >> $obsFile
          echo "# POD METRICS VISUAL BARS - ALL NAMESPACES (CPU=millicores/1000m max  MEM=MiB/512MiB max)" >> $obsFile
          echo "" >> $obsFile

          echo "$POD_ALL_RAW" | tail -n +2 | while read -r line; do
            NS=$(echo "$line"       | awk '{print $1}')
            POD_NAME=$(echo "$line" | awk '{print $2}')
            CPU_RAW=$(echo "$line"  | awk '{print $3}')
            MEM_RAW=$(echo "$line"  | awk '{print $4}')
            if [ -z "$POD_NAME" ] || [ "$POD_NAME" = "NAME" ]; then continue; fi
            CPU_M=$(parse_cpu_m "$CPU_RAW")
            MEM_MI=$(parse_mem_mi "$MEM_RAW")
            CPU_BAR=$(ascii_bar ${CPU_M:-0} 1000 40)
            MEM_BAR=$(ascii_bar ${MEM_MI:-0} 512 40)
            echo "  Namespace: $NS" >> $obsFile
            echo "  Pod      : $POD_NAME" >> $obsFile
            echo "  CPU      : $CPU_RAW  $CPU_BAR" >> $obsFile
            echo "  Memory   : $MEM_RAW  $MEM_BAR" >> $obsFile
            echo "" >> $obsFile
          done

          # ---- CLUSTER EVENTS ----
          echo "# ============================================================" >> $obsFile
          echo "# CLUSTER EVENTS (ALL NAMESPACES)                              " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- FULL COMPONENT STATUSES ----
          echo "# ============================================================" >> $obsFile
          echo "# COMPONENT STATUSES                                           " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl get componentstatuses >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- HELM RELEASES ----
          echo "# ============================================================" >> $obsFile
          echo "# HELM RELEASES (ALL NAMESPACES)                               " >> $obsFile
          echo "# ============================================================" >> $obsFile
          helm list --all-namespaces >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- PROMETHEUS DESCRIBE ----
          echo "# ============================================================" >> $obsFile
          echo "# PROMETHEUS DEPLOYMENT DESCRIBE                               " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl describe deployment prometheus-server -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- GRAFANA DESCRIBE ----
          echo "# ============================================================" >> $obsFile
          echo "# GRAFANA DEPLOYMENT DESCRIBE                                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl describe deployment grafana -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- GRAFANA LOGS ----
          echo "# ============================================================" >> $obsFile
          echo "# GRAFANA POD LOGS (LAST 100 LINES)                            " >> $obsFile
          echo "# ============================================================" >> $obsFile
          GRAFANA_POD=$(kubectl get pod -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$GRAFANA_POD" ]; then
            kubectl logs "$GRAFANA_POD" -n monitoring --tail=100 >> $obsFile 2>&1 || true
          fi
          echo "" >> $obsFile

          # ---- PROMETHEUS LOGS ----
          echo "# ============================================================" >> $obsFile
          echo "# PROMETHEUS SERVER POD LOGS (LAST 100 LINES)                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          if [ -n "$PROM_POD" ]; then
            kubectl logs "$PROM_POD" -c prometheus-server -n monitoring --tail=100 >> $obsFile 2>&1 || true
          fi
          echo "" >> $obsFile

          # ---- KUBE STATE METRICS DESCRIBE ----
          echo "# ============================================================" >> $obsFile
          echo "# KUBE-STATE-METRICS DESCRIBE                                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl describe deployment prometheus-kube-state-metrics -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- NODE EXPORTER DESCRIBE ----
          echo "# ============================================================" >> $obsFile
          echo "# PROMETHEUS NODE EXPORTER DAEMONSET DESCRIBE                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          kubectl describe daemonset prometheus-prometheus-node-exporter -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile

          # ---- SUMMARY ----
          echo "# ============================================================" >> $obsFile
          echo "# OBSERVABILITY AUDIT SUMMARY                                  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "# Prometheus Targets    : $(curl -s -u admin:admin http://localhost:3000/api/datasources | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d))' 2>/dev/null || echo N/A)" >> $obsFile
          echo "# Grafana Dashboard UID : cluster-status" >> $obsFile
          echo "# Grafana Admin URL     : http://localhost:3000" >> $obsFile
          echo "# Prometheus URL        : http://prometheus-server.monitoring.svc.cluster.local:80" >> $obsFile
          echo "# Helm Releases Active  : $(helm list --all-namespaces --short 2>/dev/null | wc -l)" >> $obsFile
          echo "# Total Pods (all NS)   : $(kubectl get pods --all-namespaces --no-headers 2>/dev/null | wc -l)" >> $obsFile
          echo "# Total Running Pods    : $(kubectl get pods --all-namespaces --no-headers 2>/dev/null | grep -c Running || echo 0)" >> $obsFile
          echo "# Total Nodes           : $(kubectl get nodes --no-headers 2>/dev/null | wc -l)" >> $obsFile
          echo "# Audit Completed At    : $(date -u) UTC" >> $obsFile
          echo "# ============================================================" >> $obsFile

      - name: 17. Upload Real Deployment Artifacts (3 Files Only)
        uses: actions/upload-artifact@v4
        with:
          name: real-grafana-deployment-artifacts
          path: |
            ./helm-chart-output.yaml
            ./observability-audit-report.yaml
            ./actual-grafana-dashboard.png
          retention-days: 7
