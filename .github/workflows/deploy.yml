name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      - name: Set up Helm Client
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Local Minikube Kubeconfig
        shell: powershell
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: Enable Metrics Server in Minikube
        shell: powershell
        run: |
          minikube addons enable metrics-server
          Start-Sleep -Seconds 30
          kubectl get pods -n kube-system

      - name: Generate Helm Chart Output File
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $OUTPUT_FILE = "./helm-chart-output.yaml"
          $RELEASE_NAME = "expo-web-release"
          $CHART_PATH = "./charts/my-web-app"
          $NAMESPACE = "default"
          $IMAGE_REPO = "${{ secrets.REGISTRY_USERNAME }}/expo-web-app"
          $IMAGE_TAG = "${{ github.sha }}"

          "# ============================================================" | Out-File $OUTPUT_FILE
          "# HELM CHART DEPLOYMENT OUTPUT" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# Generated At : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File $OUTPUT_FILE -Append
          "# Workflow     : Git Push -> Build Image -> Push Registry -> Helm Upgrade -> Kubernetes Deployment" | Out-File $OUTPUT_FILE -Append
          "# Docker Image : ${IMAGE_REPO}:${IMAGE_TAG}" | Out-File $OUTPUT_FILE -Append
          "# Helm Release : $RELEASE_NAME" | Out-File $OUTPUT_FILE -Append
          "# Namespace    : $NAMESPACE" | Out-File $OUTPUT_FILE -Append
          "# Chart Path   : $CHART_PATH" | Out-File $OUTPUT_FILE -Append
          "# Runner Type  : Self Hosted Local Runner" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# KUBERNETES CONNECTION CHECK" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl cluster-info 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# HELM RENDERED MANIFEST" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          helm template $RELEASE_NAME $CHART_PATH `
            --set image.repository="$IMAGE_REPO" `
            --set image.tag="$IMAGE_TAG" `
            --set image.imagePullPolicy="IfNotPresent" `
            --set service.type="LoadBalancer" `
            --set service.port=80 `
            --namespace $NAMESPACE 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# HELM UPGRADE OUTPUT" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          helm upgrade --install $RELEASE_NAME $CHART_PATH `
            --set image.repository="$IMAGE_REPO" `
            --set image.tag="$IMAGE_TAG" `
            --set image.imagePullPolicy="IfNotPresent" `
            --set service.type="LoadBalancer" `
            --set service.port=80 `
            --namespace $NAMESPACE `
            --create-namespace 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# HELM RELEASE STATUS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          helm status $RELEASE_NAME --namespace $NAMESPACE 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# HELM RELEASE VALUES" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          helm get values $RELEASE_NAME --namespace $NAMESPACE 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# KUBERNETES DEPLOYMENT STATUS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl get deployment --namespace $NAMESPACE -o wide 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# KUBERNETES POD STATUS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl get pods --namespace $NAMESPACE -o wide 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# KUBERNETES SERVICE STATUS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl get svc --namespace $NAMESPACE -o wide 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# POD CPU AND MEMORY METRICS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl top pods --namespace $NAMESPACE 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          "# NODE CPU AND MEMORY METRICS" | Out-File $OUTPUT_FILE -Append
          "# ============================================================" | Out-File $OUTPUT_FILE -Append
          kubectl top nodes 2>&1 | Out-File $OUTPUT_FILE -Append
          "" | Out-File $OUTPUT_FILE -Append

          Get-Content $OUTPUT_FILE

      - name: Upload Helm Output Artifact to GitHub Run View
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-output-file
          path: ./helm-chart-output.yaml
          retention-days: 7

      - name: Send Deployment Status Email via Outlook
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.OUTLOOK_MAIL_USERNAME }}
          password: ${{ secrets.OUTLOOK_MAIL_PASSWORD }}
          subject: "GitOps Cloud Rollout Verification: ${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "GitHub Actions Runner <${{ secrets.OUTLOOK_MAIL_USERNAME }}>"
          secure: false
          priority: high
          attachments: ./helm-chart-output.yaml
          body: |
            Hello Team,

            The CICD pipeline has completed.

            Docker Image:
            ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

            The Helm output file is attached.

            Best Regards,
            GitHub Actions