name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      # 1. Install the Helm Engine binaries directly onto the Cloud Runner VM host
      - name: Set up Helm Client
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      # 2. Inject your secure Kubeconfig data context to wire up the cloud runner to your nodes
      - name: Configure Kubernetes Cluster Context Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBERNETES_KUBECONFIG }}

      # 3. Download / Restart Metrics Server components and await stabilization API availability
      - name: Initialize and Validate Metrics Server
        run: |
          echo "Checking Metrics Server availability..."
          # Force a restart of the metrics deployment to clear cached or stuck socket states
          kubectl rollout restart deployment/metrics-server -n kube-system 2>/null || true
          
          echo "Awaiting Metrics Server API initialization..."
          # Polling loop up to 60 seconds to ensure metrics are accessible before running commands
          for i in {1..12}; do
            if kubectl get api-services v1beta1.metrics.k8s.io 2>/dev/null | grep -q "True"; then
              echo "Metrics API successfully verified as Active."
              break
            fi
            echo "Metrics pipeline spinning up... sleeping 5s"
            sleep 5
          done

      # 4. Compile the cloud Helm chart template logs cleanly with real-time live cluster details
      - name: Generate Cloud Helm Chart Output File
        run: |
          # Section 1: Main Header Metrics
          echo "# ============================================================" > ./helm-chart-output.yaml
          echo "# HELM CHART DEPLOYMENT OUTPUT" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# Generated At : $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> ./helm-chart-output.yaml
          echo "# Workflow     : Git Push -> Build Image -> Push Registry -> Helm Upgrade -> Kubernetes Deployment" >> ./helm-chart-output.yaml
          echo "# Docker Image : ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}" >> ./helm-chart-output.yaml
          echo "# Helm Release : expo-web-release" >> ./helm-chart-output.yaml
          echo "# Namespace    : default" >> ./helm-chart-output.yaml
          echo "# Chart Path   : ./charts/my-web-app" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml
          
          # Section 2: Manifest Generation Layout
          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# HELM RENDERED MANIFEST" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          helm template expo-web-release ./charts/my-web-app \
            --set image.repository="${{ secrets.REGISTRY_USERNAME }}/expo-web-app" \
            --set image.tag="${{ github.sha }}" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace default >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          # Section 3: Live Cluster Metrics Injection
          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# HELM RELEASE STATUS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          helm status expo-web-release --namespace default 2>&1 >> ./helm-chart-output.yaml || echo "No active helm release found." >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# HELM RELEASE VALUES" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          helm get values expo-web-release --namespace default 2>&1 >> ./helm-chart-output.yaml || echo "No custom value overrides applied." >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# KUBERNETES DEPLOYMENT STATUS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          kubectl get deployment --namespace default -o wide 2>&1 >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# KUBERNETES POD STATUS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          kubectl get pods --namespace default -o wide 2>&1 >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# KUBERNETES SERVICE STATUS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          kubectl get svc --namespace default -o wide 2>&1 >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# POD CPU AND MEMORY METRICS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          kubectl top pods --namespace default 2>&1 >> ./helm-chart-output.yaml || echo "kubectl : error: metrics not available yet" >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# NODE CPU AND MEMORY METRICS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          kubectl top nodes 2>&1 >> ./helm-chart-output.yaml || echo "Node telemetry tracking currently unavailable." >> ./helm-chart-output.yaml
          echo "" >> ./helm-chart-output.yaml

          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# METRICS STATUS" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml
          echo "# Metrics Server : Active" >> >> ./helm-chart-output.yaml
          echo "# Pod Metrics    : Captured using kubectl top pods" >> ./helm-chart-output.yaml
          echo "# Node Metrics   : Captured using kubectl top nodes" >> ./helm-chart-output.yaml
          echo "# ============================================================" >> ./helm-chart-output.yaml

      # 5. Intercept the file and upload it to the GitHub Web Interface UI as an immutable download
      - name: Upload Helm Output Artifact to GitHub Run View
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-output-file
          path: ./helm-chart-output.yaml
          retention-days: 7

      # 6. Connect securely to Outlook SMTP servers to dispatch deployment confirmation metrics with file attachment
      - name: Send Deployment Status Email via Outlook
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.OUTLOOK_MAIL_USERNAME }}
          password: ${{ secrets.OUTLOOK_MAIL_PASSWORD }}
          subject: "🚀 GitOps Cloud Rollout Verification complete: sha-${{ github.sha }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "GitHub Actions Runner Control Deck <${{ secrets.OUTLOOK_MAIL_USERNAME }}>"
          secure: false
          priority: high
          attachments: ./helm-chart-output.yaml
          body: |
            Hello Team,

            The cloud integration pipeline workflow has finished processing.

            ============================================================
            PIPELINE STATUS SUMMARY
            ============================================================
            Operator Account      : ${{ github.actor }}
            Git Repository Branch : ${{ github.ref_name }}
            Docker Image Target   : ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}
            Pushed Commit Message : "${{ github.event.head_commit.message }}"
            ============================================================

            The comprehensive 'helm-chart-output.yaml' diagnostic sheet containing live pod run states and cluster load balances has been generated, compiled, and is directly attached to this email.

            Best Regards,
            Automated GitOps DevOps Daemon Engine