name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 3. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      # 4. Setup Kubernetes Context
      - name: Setup Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # 5. Setup Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      # 6. Deploy using Helm
      - name: Deploy to Kubernetes via Helm
        run: |
          helm upgrade --install expo-web-release ./charts/my-web-app \
            --set image.repository=${{ secrets.REGISTRY_USERNAME }}/expo-web-app \
            --set image.tag=${{ github.sha }} \
            --namespace default