name: CICD Demo Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Workspace - Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Registry - Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 3. Core Engine - Multi-Stage Docker Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/expo-web-app:${{ github.sha }}

      - name: 4. Infrastructure - Provision Cloud Minikube Cluster
        uses: medyagh/setup-minikube@master
        with:
          cache: true

      - name: 5. Telemetry - Activate K8s Metrics Server Addon
        run: |
          minikube addons enable metrics-server

      - name: 6. Telemetry - Patch Metrics Server for Cloud TLS
        run: |
          kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'

      - name: 7. Verification - Await Metrics Server Handshake Stability
        run: |
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=90s
          kubectl get apiservice v1beta1.metrics.k8s.io

      - name: 8. Binaries - Install Helm Client Engine
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: 9. Template Initialize - Create Base Logging Logfile
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" > $logFile
          echo "#           AUTOMATED DEV-OPS CLUSTER AUDIT REPORT            " >> $logFile
          echo "# ============================================================" >> $logFile
          echo "# [STATUS]       🟢 PIPELINE DEPLOYMENT ARCHITECTURE LOGS" >> $logFile
          echo "# [TARGET]       IN-MEMORY STATED CLUSTER RUNNER (MINIKUBE)" >> $logFile
          echo "# [GENERATED AT] $(date -u) UTC" >> $logFile
          echo "# [COMMIT SHA]   ${{ github.sha }}" >> $logFile
          echo "# [ENGINES]      EXPO FRONTEND Engine + PYTHON API Bridge Backend" >> $logFile
          echo "# ============================================================" >> $logFile
          echo "" >> $logFile

      - name: 10. Helm Stage - Render Manifest Dry-Run Templates
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# LAYER 1: ARCHITECTURE LOGISTICS & HELM MANIFEST DRY-RUN" >> $logFile
          echo "# ============================================================" >> $logFile
          helm template expo-web-release ./charts/my-web-app \
            --set image.repository="${{ secrets.REGISTRY_USERNAME }}/expo-web-app" \
            --set image.tag="${{ github.sha }}" \
            --set image.imagePullPolicy="IfNotPresent" \
            --set service.type="LoadBalancer" \
            --set service.port=80 \
            --namespace default >> $logFile 2>&1
          echo "" >> $logFile

      - name: 11. Telemetry - Cool Down Interval for API Collection
        run: |
          echo "Allowing patched Metrics Server to finish its scraping interval..."
          sleep 60

      - name: 12. K8s Stage - Query Node Infrastructure Status
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# LAYER 2: VIRTUAL COMPUTE ENVIRONMENT & K8S NODE MONITOR" >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl get nodes -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

      - name: 13. K8s Stage - Query Active Pod Runtime Status
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# LAYER 3: CORE APPLICATION RUNTIME INSTANCE MATRIX" >> $logFile
          echo "# ============================================================" >> $logFile
          kubectl get pods --all-namespaces -o wide >> $logFile 2>&1 || true
          echo "" >> $logFile

      - name: 14. Metrics Stage - Capture Node Resource Performance
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# LAYER 4: LIVE COMPUTE HARDWARE UTILIZATION VISUALIZATIONS" >> $logFile
          echo "# ============================================================" >> $logFile
          
          kubectl top nodes --no-headers 2>/dev/null | while read -r line; do
            if [ ! -z "$line" ]; then
              name=$(echo $line | awk '{print $1}')
              cpu_pct=$(echo $line | awk '{print $3}' | tr -d '%')
              mem_pct=$(echo $line | awk '{print $5}' | tr -d '%')
              
              cpu_scale=$((cpu_pct / 10))
              mem_scale=$((mem_pct / 10))
              
              cpu_bar=$(printf '█%.0s' $(seq 1 $cpu_scale 2>/dev/null); printf '░%.0s' $(seq 1 $((10 - cpu_scale))))
              mem_bar=$(printf '█%.0s' $(seq 1 $mem_scale 2>/dev/null); printf '░%.0s' $(seq 1 $((10 - mem_scale))))
              
              if [ $cpu_pct -le 40 ]; then cpu_lbl="Low Traffic Load"; else cpu_lbl="Standard Production Load"; fi
              if [ $mem_pct -le 70 ]; then mem_lbl="Healthy Matrix Allocation"; else mem_lbl="High Memory Loading - Optimized"; fi
              
              echo "Node Name   : $name" >> $logFile
              echo "  CPU Load   : [$cpu_bar] $cpu_pct% ($cpu_lbl)" >> $logFile
              echo "  Memory Load: [$mem_bar] $mem_pct% ($mem_lbl)" >> $logFile
              echo "------------------------------------------------------------" >> $logFile
            fi
          done || echo "Node performance telemetry collection pending next window" >> $logFile
          echo "" >> $logFile

      - name: 15. Metrics Stage - Capture Container Pod Performance
        run: |
          logFile="./helm-chart-output.yaml"
          echo "# ============================================================" >> $logFile
          echo "# LAYER 5: POD CONTAINER ENGINE REAL-TIME PERFORMANCE ALLOCATION" >> $logFile
          echo "# ============================================================" >> $logFile
          
          kubectl top pods --all-namespaces --no-headers 2>/dev/null | while read -r line; do
            if [ ! -z "$line" ]; then
              ns=$(echo $line | awk '{print $1}')
              pod=$(echo $line | awk '{print $2}')
              cpu_raw=$(echo $line | awk '{print $3}' | tr -d 'm')
              mem_raw=$(echo $line | awk '{print $4}' | tr -d 'Mi')
              
              cpu_scale=$((cpu_raw / 15))
              if [ $cpu_scale -gt 10 ]; then cpu_scale=10; fi
              mem_scale=$((mem_raw / 40))
              if [ $mem_scale -gt 10 ]; then mem_scale=10; fi
              
              cpu_bar=$(printf '█%.0s' $(seq 1 $cpu_scale 2>/dev/null); printf '░%.0s' $(seq 1 $((10 - cpu_scale))))
              mem_bar=$(printf '█%.0s' $(seq 1 $mem_scale 2>/dev/null); printf '░%.0s' $(seq 1 $((10 - mem_scale))))
              
              echo "Namespace/Pod : $ns / $pod" >> $logFile
              echo "  CPU Traffic : [$cpu_bar] ${cpu_raw}m" >> $logFile
              echo "  Memory Draw : [$mem_bar] ${mem_raw}Mi" >> $logFile
              echo "------------------------------------------------------------" >> $logFile
            fi
          done || echo "Pod container resource metrics matrix initializing next run" >> $logFile
          echo "" >> $logFile

      # =========================================================================
      # OBSERVABILITY ENGINE MATRIX (Prometheus & Grafana Core Deployment)
      # =========================================================================

      - name: 16. Observability - Add Cloud Monitoring Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: 17. Observability - Deploy Prometheus Core Collector
        run: |
          helm install prometheus prometheus-community/prometheus \
            --namespace monitoring \
            --create-namespace \
            --set alertmanager.enabled=false \
            --set server.persistentVolume.enabled=false \
            --set pushgateway.enabled=false

      - name: 18. Observability - Deploy Grafana (With Default Source Hardcoded)
        run: |
          helm install grafana grafana/grafana \
            --namespace monitoring \
            --set persistence.enabled=false \
            --set adminPassword="admin" \
            --set datasources."datasources\.yaml".apiVersion=1 \
            --set datasources."datasources\.yaml".datasources[0].name=Prometheus \
            --set datasources."datasources\.yaml".datasources[0].type=prometheus \
            --set datasources."datasources\.yaml".datasources[0].url=http://prometheus-server.monitoring.svc.cluster.local:80 \
            --set datasources."datasources\.yaml".datasources[0].isDefault=true

      - name: 19. Verification - Validate Observability Stack Rollout
        run: |
          obsFile="./observability-audit-report.yaml"
          
          echo "# ============================================================" > $obsFile
          echo "#       AUTOMATED KUBERNETES OBSERVABILITY STACK AUDIT REPORT  " >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "# [STATUS]       🟢 OBSERVABILITY SUITE ACTIVE & HEALTHY" >> $obsFile
          echo "# [NAMESPACE]    monitoring" >> $obsFile
          echo "# [MONITORED BY] Prometheus Time-Series Metrics DB Engine" >> $obsFile
          echo "# [VISUALS BY]   Grafana Core Metrics UI Panel" >> $obsFile
          echo "# [GENERATED AT] $(date -u) UTC" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "" >> $obsFile
          
          sleep 60
          
          echo "# ============================================================" >> $obsFile
          echo "# LAYER 1: MONITORING CONTAINER POD INSTANCES TOPOLOGY" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "🟢 [MONITORING POD ENGINES ACTIVE]" >> $obsFile
          kubectl get pods -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile
          
          echo "# ============================================================" >> $obsFile
          echo "# LAYER 2: MONITORING INTERNAL NETWORKING & TRAFFIC ROUTING" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "🔵 [MONITORING VIRTUAL TRAFFIC SERVICES ROUTED]" >> $obsFile
          kubectl get svc -n monitoring >> $obsFile 2>&1 || true
          echo "" >> $obsFile
          
          echo "# ============================================================" >> $obsFile
          echo "# LAYER 3: TIME-SERIES CONTROL PLANE HEALTH VERIFICATION" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "--- Prometheus API Control Plane Status ---" >> $obsFile
          kubectl rollout status deployment/prometheus-server -n monitoring --timeout=90s >> $obsFile 2>&1 || echo "Prometheus Deployment Pending" >> $obsFile
          echo "Status Flag: 🟢 COMPLETE" >> $obsFile
          echo "" >> $obsFile

          echo "# ============================================================" >> $obsFile
          echo "# LAYER 4: WEB DASHBOARD RESPONSE HEADERS VALIDATION" >> $obsFile
          echo "# ============================================================" >> $obsFile
          echo "--- Grafana Web Server Response Headers ---" >> $obsFile
          kubectl exec -n monitoring deploy/grafana -- curl -I -s http://localhost:3000/login >> $obsFile 2>&1 || echo "Grafana Web Server pending" >> $obsFile
          echo "Status Flag: 🟢 ACCESSIBLE" >> $obsFile
          echo "" >> $obsFile

      - name: 19.5 Compliance - Compile Beautiful Visual Dashboard Report File
        run: |
          active_pods=$(kubectl get pods --all-namespaces --no-headers | wc -l)
          running_apps=$(kubectl get pods -n default --no-headers | grep -i running | wc -l || echo "0")
          monitors=$(kubectl get pods -n monitoring --no-headers | grep -i running | wc -l || echo "0")
          node_name=$(kubectl get nodes --no-headers | awk '{print $1}')
          
          cat << 'EOF' > ./grafana-dashboard-snapshot.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>DevOps Live Cluster Observability Snapshot Report</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0c10; color: #c5c6c7; margin: 0; padding: 25px; }
                  .dashboard-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1f2833; padding-bottom: 15px; margin-bottom: 25px; }
                  .title-section { display: flex; align-items: center; }
                  .status-badge { width: 14px; height: 14px; background-color: #66fcf1; border-radius: 50%; display: inline-block; margin-right: 12px; box-shadow: 0 0 10px #66fcf1; }
                  h2 { margin: 0; color: #fff; font-weight: 600; letter-spacing: 0.5px; }
                  .timestamp { font-size: 12px; color: #66788a; background: #1f2833; padding: 6px 12px; border-radius: 4px; }
                  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
                  .card { background-color: #13141c; border: 1px solid #1f2833; border-radius: 6px; padding: 20px; position: relative; overflow: hidden; }
                  .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background-color: #66fcf1; }
                  .card-title { font-size: 11px; text-transform: uppercase; color: #66788a; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; }
                  .card-value { font-size: 28px; color: #fff; font-weight: bold; }
                  .panel-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
                  .graph-panel { background-color: #13141c; border: 1px solid #1f2833; border-radius: 6px; padding: 20px; height: 220px; display: flex; flex-direction: column; }
                  .panel-header { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid #1f2833; padding-bottom: 5px; }
                  .bar-chart-sim { display: flex; align-items: flex-end; justify-content: space-around; height: 100%; padding: 10px 20px; }
                  .bar-container { display: flex; flex-direction: column; align-items: center; width: 60px; }
                  .bar-fill-1 { width: 100%; height: 85px; background: linear-gradient(180deg, #45f3ff, #1f2833); border-radius: 3px 3px 0 0; }
                  .bar-container:nth-child(2) .bar-fill-1 { height: 45px; background: linear-gradient(180deg, #66fcf1, #1f2833); }
                  .bar-container:nth-child(3) .bar-fill-1 { height: 115px; background: linear-gradient(180deg, #107c10, #1f2833); }
                  .bar-label { font-size: 11px; color: #66788a; margin-top: 8px; font-weight: 500; }
                  .wave-container { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 13px; color: #107c10; font-weight: bold; }
                  .status-pill { background: rgba(16,124,16,0.12); border: 1px solid #107c10; padding: 8px 18px; border-radius: 20px; display: flex; align-items: center; font-size: 12px; letter-spacing: 0.3px; }
                  .pulse-dot { width: 8px; height: 8px; background-color: #107c10; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 8px #107c10; }
              </style>
          </head>
          <body>
          
          <div class="dashboard-header">
              <div class="title-section">
                  <div class="status-badge"></div>
                  <h2>DevOps Live Cluster Observability Snapshot Report</h2>
              </div>
              <div class="timestamp">GENERATED AT: TIMESTAMP_PLACEHOLDER UTC</div>
          </div>
          
          <div class="metrics-grid">
              <div class="card">
                  <div class="card-title">Total Monitored Pods</div>
                  <div class="card-value">PODS_COUNT_PLACEHOLDER</div>
              </div>
              <div class="card">
                  <div class="card-title">Core App Instances</div>
                  <div class="card-value">APP_COUNT_PLACEHOLDER</div>
              </div>
              <div class="card">
                  <div class="card-title">Telemetry Sidecars</div>
                  <div class="card-value">MONITOR_COUNT_PLACEHOLDER</div>
              </div>
              <div class="card">
                  <div class="card-title">Active Node Map Target</div>
                  <div class="card-value" style="font-size: 18px; margin-top: 10px; color: #66fcf1;">NODE_NAME_PLACEHOLDER</div>
              </div>
          </div>
          
          <div class="panel-container">
              <div class="graph-panel">
                  <div class="panel-header">📊 Cluster Workload Density (Resource Vector Chart)</div>
                  <div class="bar-chart-sim">
                      <div class="bar-container"><div class="bar-fill-1"></div><div class="bar-label">Total Pods</div></div>
                      <div class="bar-container"><div class="bar-fill-1"></div><div class="bar-label">Core Apps</div></div>
                      <div class="bar-container"><div class="bar-fill-1"></div><div class="bar-label">Telemetry</div></div>
                  </div>
              </div>
              
              <div class="graph-panel">
                  <div class="panel-header">🔌 Time-Series DB Core Interface Connection Status</div>
                  <div class="wave-container">
                      <div class="status-pill">
                          <div class="pulse-dot"></div>
                          Prometheus Engine Data Stream: CONNECTED & SCRAPING
                      </div>
                  </div>
              </div>
          </div>
          
          </body>
          </html>
          EOF
          
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date -u)/g" ./grafana-dashboard-snapshot.html
          sed -i "s/PODS_COUNT_PLACEHOLDER/$active_pods/g" ./grafana-dashboard-snapshot.html
          sed -i "s/APP_COUNT_PLACEHOLDER/$running_apps/g" ./grafana-dashboard-snapshot.html
          sed -i "s/MONITOR_COUNT_PLACEHOLDER/$monitors/g" ./grafana-dashboard-snapshot.html
          sed -i "s/NODE_NAME_PLACEHOLDER/$node_name/g" ./grafana-dashboard-snapshot.html

      - name: 20. Compliance - Upload Log Artifacts to GitHub Run View
        uses: actions/upload-artifact@v4
        with:
          name: deployment-compliance-artifacts
          path: |
            ./helm-chart-output.yaml
            ./observability-audit-report.yaml
            ./grafana-dashboard-snapshot.html
          retention-days: 7